name: Home Relay
version: "1.2.3"
slug: home_relay
description: Relais en lecture seule de la passerelle UniFi locale, de Home Assistant et du NAS Synology vers le tableau de bord de la maison (Supabase). Ne commande rien.
url: https://github.com/Tiibar/home-relay-addon
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: false
options:
  unifi_site: default
  unifi_verify_ssl: false
  interval_minutes: 5
  climate_entities: []
  weather_entity: ""
  alarm_entities: []
schema:
  unifi_url: url
  unifi_username: str
  unifi_password: password
  unifi_site: str
  unifi_verify_ssl: bool
  supabase_function_url: url
  shared_secret: password
  interval_minutes: int(1,60)
  climate_entities:
    - str?
  weather_entity: str?
  alarm_entities:
    - str?
  nas_host: str?
  nas_snmp_user: str?
  nas_snmp_auth_password: password?
  nas_snmp_priv_password: password?
